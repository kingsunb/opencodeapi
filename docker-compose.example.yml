services:
  oc-bridge:
    image: ghcr.io/kingsunb/opencodeapi:latest
    container_name: oc-bridge
    restart: unless-stopped
    environment:
      RESIN_URL: http://resin:2260
      RESIN_PROXY_TOKEN: ${RESIN_PROXY_TOKEN:?请在同目录 .env 提供}
      RESIN_ADMIN_TOKEN: ${RESIN_ADMIN_TOKEN:?请在同目录 .env 提供}
      RESIN_PLATFORM: "Default"
      BRIDGE_ACCOUNTS: "bridge-1,bridge-2,bridge-3"
      COOLDOWN_HOURS: "24"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - ./data:/data
    networks:
      - default
      # 需要被 NovaVeil 等既有网络直连时，追加外部网络：
      # - novaveil

networks:
  default: {}
  # novaveil:
  #   external: true
  #   name: novaveil_default
